spring.application.name=Micro_PacientesV1
server.port=8081

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Hacer que data.sql se ejecute después de que JPA cree las tablas
spring.jpa.defer-datasource-initialization=true

#
eureka.cliente.serviceUrl.defaultZone: http://localhost:8761/

eureka.client.instance.instance-id: ${spring.application.name}:${server.port}

